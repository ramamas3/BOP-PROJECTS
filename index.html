<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=dashboard.html">
    <title>BOP-PROJECTS - Redirecting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0366d6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .links {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #0366d6;
            color: white;
        }

        .btn-primary:hover {
            background: #0256c7;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #28a745;
            color: white;
        }

        .btn-secondary:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #0366d6;
        }

        .info p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 BOP-PROJECTS</h1>
        <p class="subtitle">Welcome to the BOP Projects Dashboard</p>
        
        <div class="loader"></div>
        <p style="color: #666; margin-top: 20px;">Redirecting to dashboard...</p>

        <div class="info">
            <p><strong>Repository:</strong> ramamas3/BOP-PROJECTS</p>
            <p><strong>Platform:</strong> GitHub</p>
        </div>

        <div class="links">
            <p style="color: #666; margin-bottom: 15px;">If you're not redirected automatically:</p>
            <a href="dashboard.html" class="btn btn-primary">📊 View Dashboard</a>
            <a href="https://github.com/ramamas3/BOP-PROJECTS" target="_blank" class="btn btn-secondary">🔗 GitHub Repository</a>
        </div>
    </div>

    <script>
        // Automatic redirect after 2 seconds (in case meta refresh doesn't work)
        setTimeout(function() {
            window.location.href = 'dashboard.html';
        }, 2000);
    </script>
</body>
</html>
